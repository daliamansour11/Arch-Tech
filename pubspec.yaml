  sign_in_with_apple: ^7.0.1
  skeletonizer: ^2.1.0+1
  url_launcher: ^6.3.1
  vector_graphics: ^1.1.19
  firebase_auth: ^5.6.0
  flutter_widget_from_html_core: ^0.9.0

dependency_overrides:
  intl: any

dev_dependencies:
  build_runner: ^2.4.14
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
